name: Actualizador Automatico

on:
  schedule:
    - cron: '0 * * * *' # Revisa automáticamente cada 1 hora
  workflow_dispatch: # Permite que puedas correrlo a mano cuando quieras desde la pestaña Actions

permissions:
  contents: write # Permiso crucial para que el bot pueda subir los cambios a la web

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar lector RSS
        run: python main.py

      - name: Guardar y subir cambios en la web
        run: |
          git config --global user.name "Bot Cristo Redentor"
          git config --global user.email "bot@users.noreply.github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de estado [skip ci]" && git push)
