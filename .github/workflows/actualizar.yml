name: Actualizador Automatico

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 * * * *' # Descomenta esto más adelante si quieres que corra solo cada 15 min

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de scraping
        run: python main.py

      - name: Guardar y subir cambios en status.json
        run: |
          git config --global user.name "Bot Actualizador"
          git config --global user.email "bot@users.noreply.github.com"
          git add status.json
          git commit -m "Actualización automática de scraping [skip ci]" || exit 0
          git push
